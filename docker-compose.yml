# Dikelola oleh `inspire` (bin/inspire). Setelan ada di data/settings.json, bukan di sini.
services:
  inspire:
    build: .
    image: inspire:local
    restart: unless-stopped
    env_file: .env          # hanya SANDBOX_TOKEN (dibuat installer)
    environment:
      INSPIRE_HOME: /app/data
      INSPIRE_MODE: docker
      INSPIRE_INBOX: /app/inbox
      SANDBOX_URL: http://sandbox:8765
    volumes:
      - ./data:/app/data
      - ./workspace/inbox:/app/inbox   # file kiriman user → terlihat di sandbox
    depends_on: [sandbox]

  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: inspire-sandbox:local
    restart: unless-stopped
    # Hanya token yang masuk, bukan rahasia lain.
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN}
    volumes:
      - ./workspace:/workspace
    # Port TIDAK dibuka ke host; hanya bisa diakses service inspire.
    expose: ["8765"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
