[project]
name = "inspire"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Muhammad Ikhsan Wibowo", email = "ikhsan.flip@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10,<4",
    "ddgs>=9.16.0",
    "deno>=2.9.7",
    "discord-py>=2.7.1",
    "httpx>=0.28.1",
    "litellm>=1.105.1",
    "openpyxl>=3.1.5",
    "pypdf>=6.21.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-telegram-bot>=21",
    "pyyaml>=6.0.3",
    "trafilatura>=2.3.1",
    "tzdata>=2026.5",
    "yt-dlp[default]>=2026.8.19",
]

[project.scripts]
inspire = "inspire.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["tests"]
