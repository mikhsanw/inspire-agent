# OPSIONAL — setelan lanjutan. Biasanya cukup `inspire setup` atau /setup di Telegram.
# Salin ke data/config.yaml; isinya menimpa data/settings.json.
# Key/rahasia JANGAN di sini: isi lewat setup (tersimpan di settings.json),
# lalu rujuk dengan ${NAMA_KEY}.
timezone: Asia/Jakarta

# Isi minimal satu gateway. Token kosong = gateway itu mati.
telegram:
  token: ${TELEGRAM_BOT_TOKEN}
  allowed_user_ids: ${ALLOWED_USER_IDS}   # "12345" atau "12345,67890"

discord:
  token: ${DISCORD_BOT_TOKEN}
  allowed_user_ids: ${DISCORD_USER_IDS}   # user ID Discord kamu (Developer Mode → Copy User ID)
  command_prefix: "!"                     # !new, !model, !skills, …

models:
  default: deepseek
  # Urutan cadangan kalau model aktif error/limit.
  fallback: [deepseek, or-free, zen]
  list:
    deepseek:
      model: deepseek/deepseek-chat       # baca DEEPSEEK_API_KEY dari env
      # vision: false → gambar diubah jadi deskripsi dulu oleh media.vision_models
    or-free:
      # Nama model :free di OpenRouter sering berubah — cek openrouter.ai/models?q=free
      # Pilih yang support "tools".
      model: openrouter/deepseek/deepseek-chat-v3-0324:free
      api_key: ${OPENROUTER_API_KEY}
    zen:
      # OpenCode Zen = endpoint OpenAI-compatible. Ganti nama model sesuai daftar free
      # di dashboard OpenCode Zen.
      model: openai/<nama-model-free>
      api_base: https://opencode.ai/zen/v1
      api_key: ${OPENCODE_API_KEY}
    # Model yang bisa lihat gambar: set vision: true → gambar dikirim langsung.
    # gemini:
    #   model: gemini/gemini-2.5-flash    # GEMINI_API_KEY
    #   vision: true
    # Contoh lain:
    # local:
    #   model: ollama_chat/qwen2.5:7b
    #   api_base: http://host.docker.internal:11434

memory:
  memory_chars: 2200   # batas MEMORY.md
  user_chars: 1400     # batas USER.md

context:
  max_tokens: 48000    # anggaran konteks
  compress_at: 0.75    # ringkas saat estimasi > 75% anggaran
  keep_last: 12        # pesan terakhir yang tak diringkas
  idle_hours: 6        # diam lebih lama → sesi baru

agent:
  max_iterations: 12
  request_timeout: 120
  task_max_iterations: 60     # mode tugas (/tugas)
  task_max_minutes: 30
  task_progress_seconds: 45

web:
  fetch_max_chars: 12000
  # Dicoba berurutan. DuckDuckGo diblokir sebagian ISP Indonesia; di VPS luar biasanya jalan.
  search_backends: [duckduckgo, bing, yahoo]

shell:
  sandbox_url: http://sandbox:8765   # kosongkan untuk mematikan tool shell
  token: ${SANDBOX_TOKEN}
  timeout: 60
  confirm_timeout: 300               # detik menunggu tombol ✅/❌, lalu batal

media:
  stt:                                 # Whisper lewat endpoint OpenAI-compatible
    api_base: https://api.groq.com/openai/v1
    api_key: ${GROQ_API_KEY}
    model: whisper-large-v3-turbo
  # Pembantu deskripsi gambar untuk model non-vision. Dicoba berurutan.
  vision_models:
    - gemini/gemini-2.5-flash          # GEMINI_API_KEY (free tier)
    # - openrouter/<model-vision>:free
  file_max_chars: 20000
  video_max_minutes: 60                # batas transkrip audio kalau video tak punya subtitle
  ytdlp_cookies: ""                    # mis. data/cookies.txt kalau YouTube minta login
  inbox_dir: inbox                     # salinan file kiriman user; di sandbox = /workspace/inbox
